name: Comment_PR
on:
  workflow_run:
    workflows: ["Test_Change"]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    # Only run if the triggering workflow produced comments. We don't gate on
    # conclusion because the test workflow intentionally exits non-zero when an
    # adapter errors, and we still want to post the error comment.
    steps:
      - name: Download PR comments artifact
        id: download
        uses: actions/download-artifact@v4
        with:
          name: pr-comments
          run-id: ${{ github.event.workflow_run.id }}
          # This GitHub token is automatically provided by GitHub Actions for every workflow run.
          # It grants permissions to the workflow to interact with the repository (read/write access).
          # The token is injected by GitHub and available as a default secret in all workflows.
          # It's commonly used for actions that need to authenticate with the GitHub API
          # (e.g., posting comments, creating issues, updating workflows, etc.)
          # Reference: https://docs.github.com/en/actions/security-guides/automatic-token-authentication
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: pr-comments
        continue-on-error: true

      - name: Post comments on PR
        if: steps.download.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const dir = 'pr-comments';
            if (!fs.existsSync(dir)) {
              core.info('No pr-comments directory, nothing to post.');
              return;
            }

            // The artifact is untrusted: never use its PR number as authority.
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];
            if (prs.length !== 1) {
              core.notice('No unique PR bound to the triggering run; skipping');
              return;
            }
            const prNumber = prs[0].number;
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo, pull_number: prNumber,
            });
            if (pr.state !== 'open' || pr.base.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` || pr.head.sha !== run.head_sha) {
              core.notice('PR no longer matches this run; skipping stale artifact');
              return;
            }

            const files = fs.readdirSync(dir)
              .filter(f => f.endsWith('.md'))
              .sort().slice(0, 20);

            for (const f of files) {
              const file = path.join(dir, f);
              const stat = fs.lstatSync(file);
              if (!stat.isFile() || stat.isSymbolicLink() || stat.size > 60000) continue;
              const body = fs.readFileSync(file, 'utf8');
              if (!body.trim()) continue;
              await github.rest.issues.createComment({
                issue_number: prNumber,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
